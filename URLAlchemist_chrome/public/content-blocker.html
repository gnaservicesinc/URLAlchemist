<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Blocker</title>
    <link rel="stylesheet" href="content-blocker.css" />
  </head>
  <body>
    <main class="guard-shell">
      <section class="guard-panel">
        <p class="eyebrow" id="pack-name">URL Alchemist</p>
        <h1 id="guard-title">Content Blocker</h1>
        <p id="guard-message">This page is blocked by URL Alchemist.</p>
        <p class="reason" id="guard-reason" hidden></p>
        <img id="guard-media" alt="" hidden />
        <div class="challenge-tasks" id="challenge-tasks"></div>
        <button class="continue-button" id="continue-button" type="button" disabled>Continue</button>
        <p class="source" id="source-url"></p>
      </section>
    </main>
    <script src="content-blocker.js"></script>
  </body>
</html>
